<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather forecast</title>
<meta name="description" content="A Met Office Site Specific forecast in the layout of the retiring Met Office display.">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="./styles/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 40'%3E%3Ccircle cx='18' cy='15' r='7.5' fill='%23f6a01f'/%3E%3Cpath d='M9.02 31 A8 8 0 0 1 18.9 18.6 A10.5 10.5 0 0 1 34.6 19.6 A6.5 6.5 0 0 1 39.2 31 Z' fill='%23fff' stroke='%234a4a4a' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#forecast">Skip to forecast</a>

<div class="app">

  <header class="topbar">
    <form class="search" id="search-form" role="search" autocomplete="off">
      <input class="search__input" id="search-input" type="search" name="place"
             placeholder="Enter a town, postcode or latitude, longitude"
             aria-label="Search for a location" aria-expanded="false"
             aria-controls="suggestions" role="combobox">
      <button class="search__submit" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="7" fill="none" stroke="#3d3d3d" stroke-width="2"/>
          <path d="M15.8 15.8 L22 22" stroke="#3d3d3d" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
    </form>
    <button class="topbar__settings" id="settings-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.4a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.4a.5.5 0 0 0 .1.6L4.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.4a.5.5 0 0 0 .6.2l2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6a.5.5 0 0 0 .5.4h4a.5.5 0 0 0 .5-.4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1a.5.5 0 0 0 .6-.2l2-3.4a.5.5 0 0 0-.1-.6ZM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/>
      </svg>
    </button>
  </header>

  <div class="banner" aria-hidden="true">
    <svg viewBox="0 0 1200 150" preserveAspectRatio="none">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7fb5dd"/><stop offset="0.55" stop-color="#bcd9ec"/>
          <stop offset="1" stop-color="#e3eef4"/>
        </linearGradient>
        <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9fb894"/><stop offset="1" stop-color="#87a97e"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="150" fill="url(#sky)"/>
      <ellipse cx="150" cy="46" rx="86" ry="22" fill="#ffffff" opacity="0.62"/>
      <ellipse cx="215" cy="52" rx="60" ry="17" fill="#ffffff" opacity="0.5"/>
      <ellipse cx="760" cy="38" rx="104" ry="24" fill="#ffffff" opacity="0.55"/>
      <ellipse cx="1010" cy="58" rx="78" ry="19" fill="#ffffff" opacity="0.45"/>
      <path d="M0 108 L120 84 L235 104 L350 76 L470 100 L600 82 L720 102 L860 78 L1000 98 L1120 86 L1200 100 L1200 150 L0 150 Z" fill="url(#far)"/>
      <path d="M0 126 L160 112 L320 128 L500 110 L680 126 L880 112 L1060 128 L1200 118 L1200 150 L0 150 Z" fill="#6d9165"/>
      <path d="M0 140 L200 132 L420 142 L640 132 L900 142 L1200 134 L1200 150 L0 150 Z" fill="#557a50"/>
    </svg>
  </div>

  <main id="forecast" class="main" hidden>
    <h1 class="place" id="place-name"></h1>

    <div class="hero-scroll" id="hero-scroll">
      <div class="daystrip" id="day-strip"></div>
    </div>

    <section class="hourly" aria-label="Hourly forecast">
      <div class="hourly__viewport" id="hourly-viewport" tabindex="0"></div>
      <button class="nav-btn nav-btn--prev" id="scroll-prev" type="button" aria-label="Scroll back" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn nav-btn--next" id="scroll-next" type="button" aria-label="Scroll forward">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <p class="status" id="status"></p>
  </main>

  <section class="setup" id="setup" hidden>
    <div class="setup__card">
      <h1 class="setup__title">Set up your forecast</h1>
      <p class="setup__lede">
        This app reads the Met Office Weather DataHub <strong>Site Specific</strong> API.
        Your key and location are stored in this browser only — nothing is sent anywhere else.
      </p>

      <label class="field">
        <span class="field__label">Met Office DataHub API key</span>
        <input class="field__input" id="setup-key" type="password" autocomplete="off"
               placeholder="Paste your Site Specific API key">
        <span class="field__hint">
          Leave this blank to explore with the bundled sample data first.
          Get a free key at <a href="https://datahub.metoffice.gov.uk/" target="_blank" rel="noreferrer noopener">datahub.metoffice.gov.uk</a>.
        </span>
      </label>

      <label class="field">
        <span class="field__label">Location</span>
        <input class="field__input" id="setup-place" type="text"
               placeholder="Town, postcode, or 51.9, -2.08">
        <span class="field__hint" id="setup-place-hint">Press Find to look this up.</span>
      </label>

      <div class="setup__row">
        <button class="btn" id="setup-find" type="button">Find</button>
        <button class="btn btn--ghost" id="setup-locate" type="button">Use my location</button>
      </div>

      <ul class="setup__results" id="setup-results" hidden></ul>

      <div class="setup__row setup__row--end">
        <button class="btn btn--primary" id="setup-save" type="button" disabled>Show forecast</button>
      </div>
      <p class="setup__error" id="setup-error" hidden></p>
    </div>
  </section>

  <div class="loading" id="loading" hidden>
    <div class="loading__spinner" aria-hidden="true"></div>
    <p id="loading-text">Loading forecast…</p>
  </div>

  <div class="error-panel" id="error-panel" hidden>
    <h2 id="error-title">Could not load the forecast</h2>
    <p id="error-body"></p>
    <div class="setup__row">
      <button class="btn" id="error-retry" type="button">Try again</button>
      <button class="btn btn--ghost" id="error-settings" type="button">Open settings</button>
    </div>
  </div>

</div>

<dialog class="dialog" id="settings-dialog">
  <form method="dialog" class="dialog__form">
    <h2 class="dialog__title">Settings</h2>

    <label class="field">
      <span class="field__label">API key</span>
      <input class="field__input" id="set-key" type="password" autocomplete="off" placeholder="Not set">
    </label>

    <label class="field">
      <span class="field__label">Cache responses for</span>
      <select class="field__input" id="set-cache">
        <option value="30">30 minutes</option>
        <option value="60">1 hour</option>
        <option value="180">3 hours</option>
        <option value="360">6 hours</option>
      </select>
      <span class="field__hint">Protects your free-tier call budget. A refresh always fetches.</span>
    </label>

    <label class="field">
      <span class="field__label">CORS proxy (optional)</span>
      <input class="field__input" id="set-proxy" type="url" placeholder="https://my-proxy.example.com/{url}">
      <span class="field__hint">
        DataHub sends no cross-origin headers, so a browser cannot call it directly from
        GitHub Pages. Put your own proxy here — use <code>{url}</code> where the encoded
        target URL should go, or leave a bare prefix to have it appended.
      </span>
    </label>

    <p class="dialog__stats" id="set-stats"></p>

    <div class="dialog__actions">
      <button class="btn btn--ghost" id="set-clear" type="button">Forget everything</button>
      <span class="dialog__spacer"></span>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn btn--primary" id="set-save" type="button">Save</button>
    </div>
  </form>
</dialog>

<div class="popover" id="info-popover" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
